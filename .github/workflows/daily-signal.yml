name: Daily AI Signal Draft

on:
  schedule:
    # GitHub cron is UTC. This is about 08:30 Chicago time during daylight saving time.
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily signal draft
        run: npm run daily:signal -- --date "$(TZ=America/Chicago date +%F)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Guard public article content
        run: npm run content:guard

      - name: Build site
        run: npm run build

      - name: Commit draft
        run: |
          if [ -z "$(git status --porcelain -- src/blog draft-notes)" ]; then
            echo "No daily signal changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blog draft-notes
          git commit -m "Add daily signal draft for $(TZ=America/Chicago date +%F)"
          git push
