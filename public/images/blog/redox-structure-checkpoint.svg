<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Redox predictor structure-confirmation workflow</title>
  <desc id="desc">Chemical name or SMILES leads to name options, an editable rendered structure, user confirmation, and finally a model prediction.</desc>
  <rect width="1200" height="500" fill="#f5f3eb"/>
  <text x="70" y="85" fill="#1c2621" font-family="Arial, sans-serif" font-size="33" font-weight="700">A structure checkpoint before prediction</text>
  <text x="70" y="122" fill="#58665e" font-family="Arial, sans-serif" font-size="19">The predictor receives a molecule only after its identity is visible and editable.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="200" width="190" height="150" rx="18" fill="#ffffff" stroke="#c8d9cd" stroke-width="2"/>
    <text x="95" y="250" fill="#127746" font-size="19" font-weight="700">1. Enter</text>
    <text x="95" y="285" fill="#25342b" font-size="18">chemical name</text>
    <text x="95" y="313" fill="#25342b" font-size="18">or SMILES</text>
    <path d="M286 275H347" stroke="#76a788" stroke-width="4"/><path d="M347 275l-13-9v18z" fill="#76a788"/>
    <rect x="365" y="200" width="190" height="150" rx="18" fill="#ffffff" stroke="#c8d9cd" stroke-width="2"/>
    <text x="390" y="250" fill="#127746" font-size="19" font-weight="700">2. Resolve</text>
    <text x="390" y="285" fill="#25342b" font-size="18">PubChem options</text>
    <text x="390" y="313" fill="#25342b" font-size="18">LLM fallback</text>
    <path d="M581 275H642" stroke="#76a788" stroke-width="4"/><path d="M642 275l-13-9v18z" fill="#76a788"/>
    <rect x="660" y="180" width="220" height="190" rx="18" fill="#e7f3ea" stroke="#77a888" stroke-width="2"/>
    <text x="685" y="230" fill="#0d6e3e" font-size="19" font-weight="700">3. Check structure</text>
    <text x="685" y="266" fill="#25342b" font-size="18">RDKit drawing</text>
    <text x="685" y="294" fill="#25342b" font-size="18">editable SMILES</text>
    <text x="685" y="330" fill="#25342b" font-size="18">user confirmation</text>
    <path d="M906 275H967" stroke="#76a788" stroke-width="4"/><path d="M967 275l-13-9v18z" fill="#76a788"/>
    <rect x="985" y="200" width="150" height="150" rx="18" fill="#127746"/>
    <text x="1010" y="250" fill="#ffffff" font-size="19" font-weight="700">4. Predict</text>
    <text x="1010" y="285" fill="#ffffff" font-size="18">Random</text>
    <text x="1010" y="313" fill="#ffffff" font-size="18">Forest</text>
  </g>
  <text x="70" y="432" fill="#58665e" font-family="Arial, sans-serif" font-size="17">Conceptual SciencesLoop diagram. The output is a RedDB DFT-scale model estimate, not an experimental measurement.</text>
</svg>
